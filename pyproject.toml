[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "pyshacl-turbo"
version = "0.3.2"
description = "A Rust SHACL engine with Python bindings and pySHACL-compatible APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "vendor/**/LICENSE*"]
authors = [{name = "DataRoad Inc, Delaware, USA, trading as Legra"}]
keywords = ["shacl", "rdf", "validation", "sparql", "rust"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["rdflib>=7.3,<8"]

[project.urls]
Repository = "https://github.com/legra-ai/pyshacl-turbo"
Issues = "https://github.com/legra-ai/pyshacl-turbo/issues"

[project.optional-dependencies]
oxigraph = ["pyoxigraph>=0.5,<0.6"]
test = [
    "pytest>=8,<10",
    "pytest-cov>=7.1,<8",
    "pyshacl[oxigraph]==0.40.1",
    "ruff>=0.12",
    "pyyaml>=6,<7",
    "rdflib-turbo==0.1.0a2",
]

[project.scripts]
pyshacl-turbo = "pyshacl_turbo.cli:entrypoint"
pyshacl-turbo-rules = "pyshacl_turbo.cli:rules_entrypoint"

[tool.maturin]
profile = "release"
locked = true
editable-profile = "release"
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "pyshacl_turbo._native"
features = ["pyo3/extension-module"]
include = [
    {path = "uv.lock", format = "sdist"},
    {path = "native-coverage-sources.json", format = "sdist"},
    {path = "vendor/**/*", format = "sdist"},
    {path = "tests/**/*", format = "sdist"},
    {path = "scripts/**/*", format = "sdist"},
    {path = "docs/**/*", format = "sdist"},
    {path = "benchmarks/**/*", format = "sdist"},
    {path = ".github/**/*", format = "sdist"},
    {path = ".githooks/**/*", format = "sdist"},
    {path = "rust-toolchain.toml", format = "sdist"},
    {path = "rustfmt-toolchain", format = "sdist"},
    {path = "requirements-test.lock", format = "sdist"},
    {path = "Makefile", format = "sdist"},
]
exclude = ["**/target/**/*", "**/__pycache__/**/*", "**/.pytest_cache/**/*", "**/.ruff_cache/**/*", "**/CHANGELOG*", "crates/engine/build.rs", ".cargo/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyshacl_turbo"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 100
precision = 1
show_missing = true

[tool.coverage.html]
title = "pyshacl-turbo Python coverage (lines and branches)"
show_contexts = true

[tool.ruff]
line-length = 100

[dependency-groups]
dev = ["mypy>=1.15,<3"]
