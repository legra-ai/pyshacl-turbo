[build-system]
requires = ["hatchling>=1.32.3,<2"]
build-backend = "hatchling.build"

[project]
name = "pyshacl-turbo"
version = "0.7.0"
description = "A Rust SHACL engine with Python bindings and pySHACL-compatible APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "vendor/pyshacl/LICENSE.txt"]
authors = [{name = "DataRoad Inc, Delaware, USA, trading as Legra"}]
keywords = ["shacl", "rdf", "validation", "sparql", "rust"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "rdflib[html]>=7.3,<8",
    "rdflib-turbo==0.2.0a23",
]

[project.urls]
Repository = "https://github.com/legra-ai/pyshacl-turbo"
Issues = "https://github.com/legra-ai/pyshacl-turbo/issues"

[project.optional-dependencies]
oxigraph = ["pyoxigraph>=0.5,<0.6"]
test = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "pyshacl[oxigraph]==0.40.1",
    "ruff>=0.12",
    "pyyaml>=6,<7",
    "rdflib-turbo==0.2.0a23",
    "owlrl-turbo==0.2.0a1",
]

[project.scripts]
pyshacl-turbo = "pyshacl_turbo.cli:entrypoint"
pyshacl-turbo-rules = "pyshacl_turbo.cli:rules_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["python/pyshacl_turbo"]

[tool.hatch.build.targets.sdist]
include = [
    "/python",
    "/vendor/pyshacl",
    "/vendor/pyshacl-issue-70.patch",
    "/tests",
    "/scripts",
    "/tools",
    "/docs",
    "/benchmarks",
    "/.github",
    "/.githooks",
    "/.gitattributes",
    "/uv.lock",
    "/pyproject.toml",
    "/Makefile",
    "/LICENSE-*",
    "/README.md",
]
exclude = [
    "**/target/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/CHANGELOG*",
    "/.cargo/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyshacl_turbo"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 100
precision = 1
show_missing = true

[tool.coverage.html]
title = "pyshacl-turbo Python coverage (lines and branches)"
show_contexts = true

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "mypy>=1.15,<3",
    "ruff>=0.17.1",
]
packaging = [
    "twine==7.0.0",
]
