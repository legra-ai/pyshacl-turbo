[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pyshacl-turbo"
version = "0.1.0"
description = "A Rust SHACL engine with Python bindings; experimental compatibility milestone"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "vendor/**/LICENSE*"]
dependencies = ["rdflib>=7.3,<8"]

[project.urls]
Repository = "https://github.com/legra-ai/pyshacl-turbo"
Issues = "https://github.com/legra-ai/pyshacl-turbo/issues"

[project.optional-dependencies]
oxigraph = ["pyoxigraph>=0.5,<0.6"]
test = ["pytest>=8,<9", "pyshacl[oxigraph]==0.40.1", "ruff>=0.12"]

[project.scripts]
pyshacl-turbo = "pyshacl_turbo.cli:entrypoint"
pyshacl-turbo-rules = "pyshacl_turbo.cli:rules_entrypoint"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "pyshacl_turbo._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
