[package]
name = "pyshacl-turbo-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for the pyshacl-turbo Rust engine"
publish = false
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3.workspace = true
pyshacl-turbo-engine = { path = "../engine" }
serde_json = "1"
