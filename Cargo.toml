[workspace]
members = ["crates/engine", "crates/python"]
default-members = ["crates/engine", "crates/python"]
# Test vendored crates independently, without unifying Turbo's opt-in features.
exclude = ["vendor/fancy-regex-0.19.2", "vendor/spareval-0.2.7"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99.1"
authors = ["DataRoad Inc, Delaware, USA, trading as Legra"]
repository = "https://github.com/legra-ai/pyshacl-turbo"

[workspace.dependencies]
oxigraph = { version = "=0.5.11", default-features = false }
thiserror = "2"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[patch.crates-io]
fancy-regex = { path = "vendor/fancy-regex-0.19.2" }
oxrdf = { path = "vendor/oxrdf-0.3.4" }
sparopt = { path = "vendor/sparopt-0.3.7" }
spareval = { path = "vendor/spareval-0.2.7" }

spargebra = { path = "vendor/spargebra-0.4.7" }
oxsdatatypes = { path = "vendor/oxsdatatypes-0.2.3" }
