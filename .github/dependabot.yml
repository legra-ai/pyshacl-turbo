version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      compatible:
        update-types: [minor, patch]
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      compatible:
        update-types: [minor, patch]
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      compatible:
        update-types: [minor, patch]
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: uv
    directory: /benchmarks
    schedule:
      interval: weekly
    # These product versions define the recorded historical comparison.
    # Change them deliberately with its baseline and version matrices.
    ignore:
      - dependency-name: rdflib
      - dependency-name: owlrl
      - dependency-name: pyshacl
      - dependency-name: rdflib-turbo
      - dependency-name: owlrl-turbo
      - dependency-name: pyshacl-turbo
    commit-message:
      prefix: build
      include: scope
