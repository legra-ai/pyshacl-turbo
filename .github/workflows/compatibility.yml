name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  schedule:
    - cron: '27 4 * * *'

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash {0}

jobs:
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
      - name: Build native extension and install pinned test dependencies
        run: make dev PYTHON=3.13
      - name: W3C, corrected suite, fixture audit and direct public contracts
        run: make test-compatibility
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-reports
          path: |
            w3c-results.xml
            upstream-results.json
            reference-fixture-audit.json
            direct-contract.json
            direct-contract.md
          if-no-files-found: error
