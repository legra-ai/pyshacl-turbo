name: Companion benchmark correctness
on:
  pull_request:
    paths:
      - benchmarks/companions*
      - benchmarks/pyproject.toml
      - benchmarks/uv.lock
      - tests/test_companion_benchmark.py
      - tests/test_benchmark_canonicalization.py
      - tests/test_benchmark_encoder_versions.py
      - tests/test_companion_baseline.py
      - benchmarks/check_companions.py
      - tests/upstream_support/process_launch.py
      - .github/workflows/companions.yml
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}
jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.1"
      - run: uv sync --project benchmarks --locked --no-build --python 3.13
      - run: uv run --project benchmarks --locked --no-sync python -I benchmarks/companions.py --observation-encoder rdflib-v1 --nodes 100 --repeats 2 --memory-repeats 1 --output benchmark-artifacts/companions.json
      - run: uv run --project benchmarks --locked --no-sync python -I benchmarks/check_companions.py --report benchmark-artifacts/companions.json --baseline benchmarks/companions-baseline.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: companion-benchmarks-${{ matrix.os }}
          path: benchmark-artifacts/
          if-no-files-found: warn
