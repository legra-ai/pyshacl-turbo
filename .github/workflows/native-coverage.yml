name: Native Rust coverage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  schedule:
    - cron: '11 6 * * 1'
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview, rustfmt, clippy
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt
      - name: Build the original pure facade archives
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/facade-dist" || exit "$?"
          uv build --wheel --out-dir "$RUNNER_TEMP/facade-wheel" "$RUNNER_TEMP"/facade-dist/*.tar.gz || exit "$?"
      - name: Reject an incapable declared registry provider before compiling LLVM tools
        run: uv run --no-project python -B scripts/check_registry_pair.py "$RUNNER_TEMP"/facade-wheel/*-py3-none-any.whl
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Verify published native authority and run its sole collector and gates
        run: uv run --no-project python -B scripts/owner_driver.py --facade-source "$GITHUB_WORKSPACE" --facade-wheel "$RUNNER_TEMP"/facade-wheel/*-py3-none-any.whl --output "$RUNNER_TEMP/native-owner" --gate coverage
      - uses: actions/upload-artifact@v7
        with:
          name: rust-api-documentation
          path: ${{ runner.temp }}/native-owner/rustdoc/doc/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-rust-coverage
          path: ${{ runner.temp }}/native-owner/native-coverage/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-owner-authority
          path: ${{ runner.temp }}/native-owner/*.json
          if-no-files-found: error
