name: Regex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  schedule:
    - cron: '37 4 * * *'

concurrency:
  group: regex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash {0}

jobs:
  regex:
    name: regex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt
      - name: Upstream matcher tests and Python-mode VM regressions
        # The vendored matcher is formatted by the same pinned nightly.
        run: make test-regex
