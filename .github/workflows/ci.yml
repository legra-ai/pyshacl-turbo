name: Tests and wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash {0}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build native extension and install pinned test dependencies
        run: make dev PYTHON=${{ matrix.python }}
      - name: Python, Rust, formatting and lint checks
        run: make check
      - name: SPARQL evaluator defaults and opt-in compatibility features
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: make test-sparql-evaluator
      - name: Python line and branch coverage with pytest-cov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: make test-coverage
      - name: Add coverage to the job summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: .venv/bin/python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: python-coverage
          path: |
            python-coverage.xml
            python-coverage.json
            htmlcov/
          if-no-files-found: error
      - name: Package the coverage report and badge for GitHub Pages
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-pages-artifact@v5
        with:
          path: htmlcov
      - name: Build wheel
        run: .venv/bin/maturin build --release --locked --out dist
      - name: Create isolated wheel environment
        run: uv venv --python ${{ matrix.python }} .wheel-venv
      - name: Install wheel with only runtime dependencies
        run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - name: Test installed wheel without pySHACL or owlrl
        run: .wheel-venv/bin/python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: test
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: python
        run: |
          import os
          if os.environ['VERIFY_RESULT'] != 'success':
              raise SystemExit('One or more required verification jobs did not pass')

  publish-coverage:
    name: Publish Python coverage
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the measured coverage report and badge
        id: deployment
        uses: actions/deploy-pages@v5
