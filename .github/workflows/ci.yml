name: Tests and wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash {0}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the pinned shared planner to support a pure uv project
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/release_policy_capability.py --workflow .github/workflows/ci.yml --receipt "$RUNNER_TEMP/release-policy-capability.json"
      - uses: actions/create-github-app-token@v3
        id: writer
        if: github.ref == 'refs/heads/main'
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: legra-ai/github-actions/.github/actions/prepare-cargo-release@5c494a21a1df770e526e069ddf0dac0c0797e374
        id: release
        with:
          token: ${{ steps.writer.outputs.token || github.token }}
          breaking-change-bump: minor
          manifest-kind: uv
          tag-format: pep440

  compatibility:
    needs: prepare
    uses: ./.github/workflows/compatibility.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  regex:
    needs: prepare
    uses: ./.github/workflows/regex.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  native-coverage:
    needs: prepare
    uses: ./.github/workflows/native-coverage.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  shared-pipeline:
    needs: prepare
    uses: ./.github/workflows/shared-pipeline.yml
    permissions:
      contents: write
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  verify:
    needs: [prepare, wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            coverage: ''
          - os: ubuntu-latest
            python: '3.13.16'
            coverage: '--coverage'
          - os: macos-latest
            python: '3.13.16'
            coverage: ''
          - os: windows-latest
            python: '3.13.16'
            coverage: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - name: Provide the pinned YAML build interpreter for the minimum runtime
        if: matrix.python == '3.11'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
      - uses: actions/download-artifact@v8
        with:
          name: release-wheel
          path: dist
      - name: Validate the original pure wheel with its exact published native owner
        run: uv run --no-project python -B scripts/provider_validation.py --facade-source "$GITHUB_WORKSPACE" --facade-wheel dist/*-py3-none-any.whl --output "$RUNNER_TEMP/facade-validation" ${{ matrix.coverage }}
      - name: Add coverage to the job summary
        if: matrix.coverage != ''
        env:
          COVERAGE_FILE: ${{ runner.temp }}/facade-validation/python.coverage
        run: uv run --project "$RUNNER_TEMP/facade-validation/project" --locked --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.coverage != ''
        with:
          name: python-coverage
          path: |
            ${{ runner.temp }}/facade-validation/python-coverage.xml
            ${{ runner.temp }}/facade-validation/python-coverage.json
            ${{ runner.temp }}/facade-validation/htmlcov/
          if-no-files-found: error

  test:
    name: test
    needs: [prepare, verify, compatibility, regex, sdist, wheels, wheel-acceptance, native-coverage, shared-pipeline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - name: Require every platform to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: uv run --no-project python {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit(f'Required release gates did not pass: {failed}')
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete release artifact inventory before tagging is allowed
        run: uv run --no-project python scripts/release_packages.py check-build
      - name: Verify declared registry companion before publication
        if: github.ref == 'refs/heads/main' && needs.prepare.outputs.release == 'true'
        run: uv run --no-project python scripts/check_registry_pair.py dist/*-py3-none-any.whl

  sdist:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - name: Build source distribution
        run: uv build --sdist --out-dir dist
      - name: Check source inventory, patched dependencies and license texts
        run: uv run --no-project python scripts/check_package.py dist/*.tar.gz
      - name: Check PyPI metadata rendering
        run: uv --project tools/packaging run --locked --only-group packaging twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: [prepare, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/download-artifact@v8
        with:
          name: release-sdist
          path: source-dist
      - name: Build the universal facade wheel from the original source archive
        run: uv build --wheel --out-dir dist source-dist/*.tar.gz
      - name: Check pure wheel metadata, payload and licenses
        run: uv run --no-project python scripts/check_package.py dist/*.whl
      - name: Check PyPI metadata rendering
        run: uv --project tools/packaging run --locked --only-group packaging twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error

  wheel-acceptance:
    needs: [prepare, wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/download-artifact@v8
        with:
          name: release-wheel
          path: dist
      - name: Verify the original facade wheel and its native provider on this OS
        run: uv run --no-project python scripts/test_wheel.py dist

  publish:
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pyshacl-turbo/
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: legra-ai/github-actions/.github/actions/tag-tested-release@5c494a21a1df770e526e069ddf0dac0c0797e374
        with:
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
          manifest-kind: uv
          tag-format: pep440
      - uses: legra-ai/github-actions/.github/actions/generate-changelog@5c494a21a1df770e526e069ddf0dac0c0797e374
        with:
          revision: ${{ needs.prepare.outputs.revision }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.revision }}
          body_path: CHANGELOG.md
          draft: true
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Persist original tested archives for interrupted-release recovery
        run: uv run --no-project python scripts/release_packages.py stage
      - name: Verify existing registry files and select only missing archives
        id: pending
        run: uv run --no-project python scripts/release_packages.py filter
      - name: Attest the original tested archives
        if: steps.pending.outputs.missing == 'true'
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a
        with:
          paths: pending-packages/*
      - name: Publish through PyPI trusted publishing
        if: steps.pending.outputs.missing == 'true'
        run: uv publish --trusted-publishing always pending-packages/*
      - name: Verify complete PyPI release against original hashes
        run: uv run --no-project python scripts/release_packages.py verify
      - name: Publish the completed GitHub release
        run: gh release edit "v$RELEASE_VERSION" --draft=false

  publish-coverage:
    name: Publish measured coverage
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: actions/download-artifact@v8
        with:
          name: native-rust-coverage
          path: coverage-site/reports
      - uses: actions/download-artifact@v8
        with:
          name: rust-api-documentation
          path: coverage-site/rustdoc
      - run: uv run --no-project python scripts/coverage_site.py --python coverage-site/reports/python-coverage.json --rust coverage-site/reports/summary.json --output coverage-site --project pyshacl-turbo --revision "${{ needs.prepare.outputs.revision }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-site
      - name: Publish the measured coverage report and badge
        id: deployment
        uses: actions/deploy-pages@v5
