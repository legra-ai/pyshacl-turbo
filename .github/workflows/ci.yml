name: Tests and wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash {0}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/create-github-app-token@v3
        id: writer
        if: github.ref == 'refs/heads/main'
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
      - uses: legra-ai/github-actions/.github/actions/prepare-cargo-release@42049e5750b05a59356fc6756424ca32c2834eb6
        id: release
        with:
          token: ${{ steps.writer.outputs.token || github.token }}

  compatibility:
    needs: prepare
    uses: ./.github/workflows/compatibility.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  regex:
    needs: prepare
    uses: ./.github/workflows/regex.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  verify:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Build native extension and install pinned test dependencies
        # Formatting uses its own nightly pin; compilation remains on 1.99.1.
        run: make dev PYTHON=${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt
      - name: Python, Rust, formatting and lint checks
        run: make check
      - name: SPARQL evaluator defaults and opt-in compatibility features
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: make test-sparql-evaluator
      - name: Python line and branch coverage with pytest-cov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: make test-coverage
      - name: Add coverage to the job summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: .venv/bin/python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: python-coverage
          path: |
            python-coverage.xml
            python-coverage.json
            htmlcov/
          if-no-files-found: error
      - name: Package the coverage report and badge for GitHub Pages
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-pages-artifact@v5
        with:
          path: htmlcov

  test:
    name: test
    needs: [prepare, verify, compatibility, regex, sdist, wheels]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit(f'Required release gates did not pass: {failed}')
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete release artifact inventory before tagging is allowed
        run: python scripts/release_packages.py check-build

  sdist:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
      - name: Build source distribution
        run: uv build --sdist --out-dir dist
      - name: Check source inventory, patched dependencies and license texts
        run: python scripts/check_package.py dist/*.tar.gz
      - name: Check PyPI metadata rendering
        run: uvx --from twine==6.2.0 twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: [prepare, sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - os: macos-15-intel
            target: x86_64-apple-darwin
            args: --compatibility pypi
            deployment_target: '10.12'
          - os: macos-15
            target: aarch64-apple-darwin
            args: --compatibility pypi
            deployment_target: '11.0'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --compatibility pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: release-sdist
          path: source-dist
      - name: Unpack the verified source archive for the manylinux build
        if: runner.os == 'Linux'
        run: |
          mkdir source-build || exit 1
          tar -xzf source-dist/*.tar.gz --strip-components=1 -C source-build || exit 1
      - name: Build Linux release wheel with the native manylinux toolchain
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: '2_28'
          container: ${{ matrix.container }}
          docker-options: -e CARGO_BUILD_WARNINGS=deny
          working-directory: source-build
          args: --release --locked --out ../dist --interpreter python3.13
      - name: Build release wheel from the verified source archive
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: uv build --wheel --out-dir dist -C 'maturin.build-args=--locked --target ${{ matrix.target }} ${{ matrix.args }}' source-dist/*.tar.gz
      - name: Check wheel metadata, native extension and licenses
        run: python scripts/check_package.py dist/*.whl
      - name: Check PyPI metadata rendering
        run: uvx --from twine==6.2.0 twine check --strict dist/*
      - name: Verify uv environments, locked projects, tools and optional Store input
        run: python scripts/test_wheel.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pyshacl-turbo/
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: legra-ai/github-actions/.github/actions/tag-tested-release@42049e5750b05a59356fc6756424ca32c2834eb6
        with:
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
      - uses: legra-ai/github-actions/.github/actions/generate-changelog@42049e5750b05a59356fc6756424ca32c2834eb6
        with:
          revision: ${{ needs.prepare.outputs.revision }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.revision }}
          body_path: CHANGELOG.md
          draft: true
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Persist original tested archives for interrupted-release recovery
        run: python scripts/release_packages.py stage
      - name: Verify existing registry files and select only missing archives
        id: pending
        run: python scripts/release_packages.py filter
      - name: Publish through PyPI trusted publishing
        if: steps.pending.outputs.missing == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pending-packages/
      - name: Verify complete PyPI release against original hashes
        run: python scripts/release_packages.py verify
      - name: Publish the completed GitHub release
        run: gh release edit "v$RELEASE_VERSION" --draft=false

  publish-coverage:
    name: Publish Python coverage
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the measured coverage report and badge
        id: deployment
        uses: actions/deploy-pages@v5
